<!-- Sakura Recovery AI Chat System ONLY -->
<style>
#sakuraChatBtn{position:fixed;left:18px;bottom:18px;z-index:9999;background:#ffd000;color:#111;border:none;padding:15px 22px;border-radius:999px;font-weight:bold;cursor:pointer;box-shadow:0 8px 25px #0007;width:auto}
#sakuraChatBox{position:fixed;left:18px;bottom:80px;width:340px;max-width:92vw;background:white;border-radius:18px;overflow:hidden;display:none;z-index:9999;box-shadow:0 15px 40px #0008}
#sakuraChatHead{background:#111;color:#ffd000;padding:14px;font-weight:bold}
#sakuraChatBody{height:330px;overflow-y:auto;padding:12px;background:#fff8df;color:#111}
.sakuraMsg{padding:10px 12px;margin:8px 0;border-radius:14px;font-size:14px;line-height:1.5}
.sakuraBot{background:white;border:1px solid #ffd000}
.sakuraUser{background:#ffd000;color:#111;margin-left:40px}
#sakuraChatInputWrap{display:flex;border-top:1px solid #ddd}
#sakuraChatInput{flex:1;border:none;padding:13px;outline:none;font-size:14px;margin:0}
#sakuraChatSend{width:auto;border:none;background:#ffd000;color:#111;padding:0 15px;font-weight:bold;cursor:pointer;border-radius:0}
.sakuraQuick{display:block;width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #ffd000;background:white;color:#111;font-weight:bold;cursor:pointer}
</style>

<button id="sakuraChatBtn">💬 AI相談</button>

<div id="sakuraChatBox">
  <div id="sakuraChatHead">Sakura Recovery AI</div>
  <div id="sakuraChatBody"></div>
  <div id="sakuraChatInputWrap">
    <input id="sakuraChatInput" placeholder="メッセージを入力...">
    <button id="sakuraChatSend">送信</button>
  </div>
</div>

<script>
const sakuraChatBtn=document.getElementById("sakuraChatBtn");
const sakuraChatBox=document.getElementById("sakuraChatBox");
const sakuraChatBody=document.getElementById("sakuraChatBody");
const sakuraChatInput=document.getElementById("sakuraChatInput");
const sakuraChatSend=document.getElementById("sakuraChatSend");

function sakuraAddMsg(text,type="sakuraBot"){
  const div=document.createElement("div");
  div.className="sakuraMsg "+type;
  div.innerHTML=text;
  sakuraChatBody.appendChild(div);
  sakuraChatBody.scrollTop=sakuraChatBody.scrollHeight;
}

function sakuraQuick(text){
  sakuraAddMsg(text,"sakuraUser");
  sakuraReply(text);
}

function sakuraStart(){
  sakuraChatBody.dataset.started="yes";
  sakuraAddMsg("こんにちは。Sakura Recovery & Repair Serviceです。<br>お車のトラブル内容を選んでください。");
  sakuraAddMsg(`
    <button class="sakuraQuick" onclick="sakuraQuick('車が動かない')">🚗 車が動かない</button>
    <button class="sakuraQuick" onclick="sakuraQuick('事故・レッカー希望')">🚨 事故・レッカー希望</button>
    <button class="sakuraQuick" onclick="sakuraQuick('修理相談')">🔧 修理相談</button>
    <button class="sakuraQuick" onclick="sakuraQuick('港まで搬送')">🚢 港まで搬送</button>
    <button class="sakuraQuick" onclick="sakuraQuick('料金を知りたい')">💴 料金を知りたい</button>
  `);
}

function sakuraReply(text){
  const t=text.toLowerCase();

  if(t.includes("動かない")){
    sakuraAddMsg("現在地・車種・症状を教えてください。バッテリー、エンジン、タイヤ等を確認します。");
  }else if(t.includes("事故")||t.includes("レッカー")){
    sakuraAddMsg("安全な場所に移動してください。車の現在地、目的地、写真があれば送ってください。");
  }else if(t.includes("修理")){
    sakuraAddMsg("車種・年式・症状を教えてください。写真がある場合はフォームから送信してください。");
  }else if(t.includes("港")){
    sakuraAddMsg("現在地と行き先の港名を教えてください。例：那覇港・中城港など。");
  }else if(t.includes("料金")||t.includes("price")||t.includes("いくら")){
    sakuraAddMsg("料金は距離・車両状態・作業内容で変わります。正確な見積りはフォームから送信してください。");
  }else{
    sakuraAddMsg("ありがとうございます。お名前・電話番号・現在地・車の症状をフォームに入力してください。");
  }

  sakuraAddMsg(`<button class="sakuraQuick" onclick="document.getElementById('requestForm').scrollIntoView({behavior:'smooth'})">見積りフォームへ進む</button>`);
}

sakuraChatBtn.onclick=function(){
  sakuraChatBox.style.display=sakuraChatBox.style.display==="block"?"none":"block";
  if(!sakuraChatBody.dataset.started){sakuraStart();}
};

function sakuraSend(){
  const text=sakuraChatInput.value.trim();
  if(!text)return;
  sakuraAddMsg(text,"sakuraUser");
  sakuraChatInput.value="";
  setTimeout(()=>sakuraReply(text),400);
}

sakuraChatSend.onclick=sakuraSend;
sakuraChatInput.addEventListener("keydown",function(e){
  if(e.key==="Enter")sakuraSend();
});
</script>
