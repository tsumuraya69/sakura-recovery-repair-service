<div><label data-t="email"></label><input type="email" name="email"></div>
<div><label data-t="contactMethod"></label><select name="contact_method"><option>Phone</option><option>WhatsApp</option><option>LINE</option><option>Email</option></select></div>
</div>

<div class="grid2">
<div><label data-t="vehicleType"></label><select name="vehicle_type"><option>Car</option><option>Van</option><option>Truck</option><option>Dump</option><option>Bus</option><option>Other</option></select></div>
<div><label><span data-t="vehicleName"></span> <span class="req">*</span></label><input type="text" name="vehicle_name" required><div class="error-note" data-t="requiredText"></div></div>
</div>

<div class="grid2">
<div><label data-t="maker"></label><input type="text" name="maker"></div>
<div><label data-t="year"></label><input type="text" name="year"></div>

<option>Battery dead</option>
<option>Tire problem</option>
<option>Oil leaking</option>
<option>Brake problem</option>

en:{heroTitle:"If you have vehicle trouble in Okinawa, contact Sakura Recovery & Repair Service",heroText1:"Fast support for cars, vans, trucks, dump trucks and buses: recovery, repair, towing and port delivery.",heroText2:"Emergency vehicle recovery, repair and port delivery support in Okinawa.",hoursTitle:"Business Hours:",hours:"Monday to Saturday, 9:00 AM to 6:00 PM",trust:"It would be our pleasure to help you in your difficult time.",estimateBtn:"Request Estimate",servicesTitle:"Our Services",s1:"🚛 Vehicle Recovery",s1p:"Recovery and moving support for broken, non-running and accident vehicles.",s2:"🔧 Emergency Repair",s2p:"Battery, oil leak, brake and tire trouble support.",s3:"🚢 Port Delivery",s3p:"Vehicle repair and delivery support before shipping.",s4:"🚌 Heavy Vehicle",s4p:"Support for trucks, dump trucks, buses and heavy vehicles.",formTitle:"Estimate Request Form",customerInfo:"1. Customer Information",name:"Full Name",phone:"Telephone Number",fullAddress:"Customer Full Address",email:"Email",contactMethod:"Preferred Contact",vehicleInfo:"2. Vehicle Details",vehicleType:"Vehicle Type",vehicleName:"Vehicle Name",maker:"Maker",year:"Year",vin:"VIN or Plate Number",condition:"Running Condition",problemInfo:"3. Problem Details",vehicleProblem:"Vehicle Problem",detail:"Detailed Message",locationInfo:"4. Location",vehicleCurrentLocation:"Vehicle Current Location",destination:"Destination Port",payment1:"Card payment only.",submitBtn:"Send Request",contactTitle:"Location / Contact",hoursFull:"Business Hours: Monday to Saturday, 9:00 AM to 6:00 PM",requiredText:"This field is required.",popupTitle:"Request Sent Successfully",popupMsg:"Thank you for contacting us. Sakura Recovery staff will check your request and contact you soon.",qrTitle:"Chat on WhatsApp",qrBtn:"Open WhatsApp",aiWelcome:"Welcome to Sakura Recovery & Repair Service. Business hours are Monday to Saturday, 9:00 AM to 6:00 PM. It would be our pleasure to help you in your difficult time.",aiSelect:"Please select your vehicle problem.",notmove:"Please send your location, vehicle type and problem details.",accident:"Please move to a safe place first. Send vehicle location, destination and photos.",repair:"Please tell us vehicle model, year and repair problem.",port:"Please send your current location and destination port name.",price:"Price depends on distance, vehicle condition and work details.",other:"Please enter full name, phone, full address, vehicle name, current location and vehicle problem in the form.",formGo:"Go to Estimate Form"},
zh:{},es:{},ru:{},vi:{},ko:{},ar:{},ur:{}};

TEXT.zh={...TEXT.en,heroTitle:"在冲绳遇到车辆故障，请联系 Sakura Recovery & Repair Service",estimateBtn:"申请报价",formTitle:"报价申请表",submitBtn:"发送申请",requiredText:"此项为必填。"};
TEXT.es={...TEXT.en,heroTitle:"Si tiene problemas con su vehículo en Okinawa, contacte a Sakura Recovery & Repair Service",estimateBtn:"Solicitar Presupuesto",formTitle:"Formulario de Presupuesto",submitBtn:"Enviar Solicitud",requiredText:"Este campo es obligatorio."};
TEXT.ru={...TEXT.en,heroTitle:"Если у вас проблема с автомобилем на Окинаве, обратитесь в Sakura Recovery & Repair Service",estimateBtn:"Запросить оценку",formTitle:"Форма запроса",submitBtn:"Отправить запрос",requiredText:"Это поле обязательно."};
TEXT.vi={...TEXT.en,heroTitle:"Nếu xe gặp sự cố ở Okinawa, hãy liên hệ Sakura Recovery & Repair Service",estimateBtn:"Yêu cầu báo giá",formTitle:"Mẫu yêu cầu báo giá",submitBtn:"Gửi yêu cầu",requiredText:"Trường này là bắt buộc."};
TEXT.ko={...TEXT.en,heroTitle:"오키나와에서 차량 문제가 발생하면 Sakura Recovery & Repair Service로 연락하세요",estimateBtn:"견적 요청",formTitle:"견적 요청 양식",submitBtn:"요청 보내기",requiredText:"필수 항목입니다."};
TEXT.ar={...TEXT.en,heroTitle:"إذا واجهت مشكلة في السيارة في أوكيناوا، تواصل مع Sakura Recovery & Repair Service",estimateBtn:"طلب عرض سعر",formTitle:"نموذج طلب عرض السعر",submitBtn:"إرسال الطلب",requiredText:"هذا الحقل مطلوب."};
TEXT.ur={...TEXT.en,heroTitle:"Okinawa me gaari ka masla ho to Sakura Recovery & Repair Service se rabta karein",estimateBtn:"Estimate Request",formTitle:"Estimate Request Form",submitBtn:"Request Send Karein",requiredText:"Yeh field zaroori hai."};

let currentLang="ja";

function changeLang(lang){
currentLang=lang;
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-t]").forEach(el=>{
const k=el.getAttribute("data-t");
if(TEXT[lang] && TEXT[lang][k]) el.innerHTML=TEXT[lang][k];
});
updateQR();
}

function updateQR(){
const jp=currentLang==="ja";
document.getElementById("qrTitle").innerHTML=jp?TEXT.ja.qrTitle:TEXT.en.qrTitle;
document.getElementById("qrImage").src=jp?LINE_QR:WHATSAPP_QR;
document.getElementById("qrLink").href=jp?LINE_URL:WHATSAPP_URL;
document.getElementById("qrLink").innerHTML=jp?TEXT.ja.qrBtn:TEXT.en.qrBtn;
}

function markErrors(){
let first=null;
document.querySelectorAll("#requestForm [required]").forEach(el=>{
const bad=!el.value.trim();
el.classList.toggle("field-error",bad);
const note=el.nextElementSibling;
if(note && note.classList.contains("error-note")) note.style.display=bad?"block":"none";
if(bad && !first) first=el;
});
if(first){first.scrollIntoView({behavior:"smooth",block:"center"});first.focus();}
return !first;
}

document.querySelectorAll("#requestForm [required]").forEach(el=>{
["input","change"].forEach(evt=>el.addEventListener(evt,()=>{
el.classList.remove("field-error");
const note=el.nextElementSibling;
if(note && note.classList.contains("error-note")) note.style.display="none";
}));
});

function showPopup(){
document.getElementById("popupTitle").innerHTML=TEXT[currentLang].popupTitle;
document.getElementById("popupMsg").innerHTML=TEXT[currentLang].popupMsg;
document.getElementById("successPopup").style.display="flex";
}
function closePopup(){document.getElementById("successPopup").style.display="none";}

document.getElementById("requestForm").addEventListener("submit",async function(e){
e.preventDefault();
if(!markErrors()) return;
const form=e.target;
const data=Object.fromEntries(new FormData(form).entries());
data.created_at=new Date().toISOString();
data.language=currentLang;
try{
await fetch("https://n8n.sakurajapanbot.tech/webhook/sakura-recovery-estimate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
form.reset();
showPopup();
}catch(error){
document.getElementById("popupTitle").innerHTML="送信エラー";
document.getElementById("popupMsg").innerHTML="送信できませんでした。電話でお問い合わせください。";
document.getElementById("successPopup").style.display="flex";
}
});

function toggleAI(){
const box=document.getElementById("aiBox"),body=document.getElementById("aiBody");
box.style.display=box.style.display==="block"?"none":"block";
if(!body.dataset.started)startAI();
}
function aiMsg(text,type="bot"){
const body=document.getElementById("aiBody"),div=document.createElement("div");
div.className="ai-msg "+(type==="user"?"ai-user":"ai-bot");
div.innerHTML=text;body.appendChild(div);body.scrollTop=body.scrollHeight;
}
function startAI(){
document.getElementById("aiBody").dataset.started="yes";
aiMsg(TEXT[currentLang].aiWelcome);
showAIOptions();
}
function showAIOptions(){
aiMsg(TEXT[currentLang].aiSelect);
aiMsg(`<div class="ai-quick" onclick="quickAI('notmove')">🚗 Vehicle not moving</div><div class="ai-quick" onclick="quickAI('accident')">🚨 Accident / Tow</div><div class="ai-quick" onclick="quickAI('repair')">🔧 Repair</div><div class="ai-quick" onclick="quickAI('port')">🚢 Port Delivery</div><div class="ai-quick" onclick="quickAI('price')">💴 Price</div>`);
}
function quickAI(key){
aiMsg(key,"user");
aiMsg(TEXT[currentLang][key]||TEXT[currentLang].other);
aiMsg(`<div class="ai-quick" onclick="document.getElementById('requestForm').scrollIntoView({behavior:'smooth'})">${TEXT[currentLang].formGo}</div>`);
}
function sendAI(){
const input=document.getElementById("aiInput"),text=input.value.trim();
if(!text)return;
aiMsg(text,"user");input.value="";
setTimeout(()=>quickAI("other"),350);
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement.id==="aiInput")sendAI();});

changeLang("ja");
</script>

</body>
