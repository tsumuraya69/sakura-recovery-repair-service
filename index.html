<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakura Recovery & Repair Service</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,"Noto Sans JP",sans-serif;background:#111;color:white;overflow-x:hidden}
.hero{min-height:100vh;padding:30px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;background-size:cover;background-position:center;animation:bgslide 40s infinite}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6))}
.hero>*{position:relative;z-index:2}
@keyframes bgslide{
0%{background-image:url("recovery-10.webp")}
12%{background-image:url("recovery-4.webp")}
24%{background-image:url("recovery-5.webp")}
36%{background-image:url("recovery-6.webp")}
48%{background-image:url("recovery-7.webp")}
60%{background-image:url("recovery-8.webp")}
72%{background-image:url("recovery-9.webp")}
84%{background-image:url("recovery-14.webp")}
100%{background-image:url("recovery-15.webp")}
}
.logo{font-size:28px;font-weight:bold;color:#ffd000;margin-bottom:20px;text-shadow:0 0 10px #000}
h1{font-size:52px;line-height:1.3;color:#ffd000;margin-bottom:20px;max-width:1100px;text-shadow:0 0 12px #000}
.hero p{font-size:21px;line-height:1.8;max-width:950px;margin-bottom:12px;text-shadow:0 0 10px #000}
.btn{display:inline-block;background:#e63946;padding:18px 35px;border-radius:12px;color:white;font-size:20px;font-weight:bold;text-decoration:none;margin:10px}
.lang-select{position:fixed;top:15px;right:15px;z-index:99999;background:#ffd000;color:#111;border:none;padding:10px;border-radius:8px;font-weight:bold}
.section{padding:70px 20px}
.dark{background:#0a0a0a}
.section h2{text-align:center;font-size:40px;color:#ffd000;margin-bottom:45px}
.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px}
.card{background:#1b1b1b;padding:30px;border-radius:18px;border:1px solid #333}
.card h3{font-size:24px;margin-bottom:15px;color:#e63946}
.card p{line-height:1.8;font-size:17px}
.form{max-width:950px;margin:auto;background:#1a1a1a;padding:35px;border-radius:20px;border:1px solid #333}
.form h3{font-size:28px;margin-bottom:25px;color:#ffd000}
label{display:block;margin-bottom:10px;font-weight:bold;color:#ffd000}
input,select,textarea{width:100%;padding:15px;margin-bottom:20px;border-radius:10px;border:none;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
button{width:100%;padding:18px;border:none;background:#ffd000;color:#111;font-size:20px;font-weight:bold;border-radius:12px;cursor:pointer}
.notice{background:#241b00;border:1px solid #ffd000;padding:20px;border-radius:15px;margin:20px 0}
.contact{text-align:center}
.phone{font-size:38px;font-weight:bold;color:#e63946;margin-bottom:15px}
footer{background:#000;text-align:center;padding:30px;color:#aaa}
.fixed{position:fixed;right:18px;bottom:18px;z-index:999}
.fixed a{display:block;background:#19c463;color:white;padding:16px 24px;border-radius:999px;font-weight:bold;text-decoration:none}

/* AI CHAT */
.ai-btn{position:fixed;left:18px;bottom:18px;z-index:99999;background:#ffd000;color:#111;padding:15px 22px;border-radius:999px;font-weight:bold;cursor:pointer;box-shadow:0 8px 25px #0007}
.ai-box{position:fixed;left:18px;bottom:82px;width:370px;max-width:92vw;background:white;border-radius:18px;overflow:hidden;display:none;z-index:99999;box-shadow:0 15px 40px #0008}
.ai-head{background:#111;color:#ffd000;padding:14px;font-weight:bold}
.ai-body{height:380px;overflow-y:auto;padding:12px;background:#fff8df;color:#111}
.ai-msg{padding:10px 12px;margin:8px 0;border-radius:14px;font-size:14px;line-height:1.5}
.ai-bot{background:white;border:1px solid #ffd000}
.ai-user{background:#ffd000;color:#111;margin-left:40px}
.ai-input-wrap{display:flex;border-top:1px solid #ddd}
.ai-input{flex:1;border:none;padding:13px;outline:none;font-size:14px;margin:0}
.ai-send{background:#ffd000;color:#111;padding:13px 15px;font-weight:bold;cursor:pointer}
.ai-quick{display:block;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #ffd000;background:white;color:#111;font-weight:bold;cursor:pointer;text-align:center}
.lang-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

@media(max-width:700px){
h1{font-size:32px}.hero p{font-size:17px}.grid2{grid-template-columns:1fr}.section h2{font-size:30px}.phone{font-size:28px}
}
</style>
</head>

<select class="lang-select" id="siteLang" onchange="changeLang(this.value)">
<option value="ja">日本語</option>
<option value="en">English</option>
<option value="zh">中文</option>
<option value="es">Español</option>
<option value="ru">Русский</option>
<option value="vi">Tiếng Việt</option>
<option value="ko">한국어</option>
<option value="ar">العربية</option>
<option value="ur">Roman Urdu</option>
</select>

<section class="hero">
<div class="logo">🌸 Sakura Recovery & Repair Service</div>
<h1 data-t="heroTitle"></h1>
<p data-t="heroText1"></p>
<p data-t="heroText2"></p>
<p><b data-t="hoursTitle"></b> <span data-t="hours"></span></p>
<p data-t="trust"></p>
<a class="btn" href="tel:07084455348">📞 070-8445-5348</a>
<a class="btn" href="#requestForm" data-t="estimateBtn"></a>
</section>

<section class="section dark">
<h2 data-t="servicesTitle"></h2>
<div class="grid">
<div class="card"><h3 data-t="s1"></h3><p data-t="s1p"></p></div>
<div class="card"><h3 data-t="s2"></h3><p data-t="s2p"></p></div>
<div class="card"><h3 data-t="s3"></h3><p data-t="s3p"></p></div>
<div class="card"><h3 data-t="s4"></h3><p data-t="s4p"></p></div>
</div>
</section>

<section class="section">
<h2 data-t="formTitle"></h2>

<form class="form" id="requestForm">
<h3 data-t="customerInfo"></h3>

<div class="grid2">
<div><label data-t="name"></label><input type="text" name="customer_name" required></div>
<div><label data-t="phone"></label><input type="text" name="phone" required></div>
</div>

<div class="grid2">
<div><label data-t="email"></label><input type="email" name="email"></div>
<div>
<label data-t="contactMethod"></label>
<select name="contact_method">
<option>Phone</option><option>WhatsApp</option><option>LINE</option><option>Email</option>
</select>
</div>
</div>

<h3 data-t="vehicleInfo"></h3>

<div class="grid2">
<div>
<label data-t="vehicleType"></label>
<select name="vehicle_type">
<option>Car</option><option>Van</option><option>Truck</option><option>Dump</option><option>Bus</option><option>Other</option>
</select>
</div>
<div><label data-t="maker"></label><input type="text" name="maker"></div>
</div>

<div class="grid2">
<div><label data-t="model"></label><input type="text" name="model"></div>
<div><label data-t="year"></label><input type="text" name="year"></div>
</div>

<label data-t="vin"></label>
<input type="text" name="vin_plate">

<label data-t="condition"></label>
<select name="running_condition">
<option>Running</option>
<option>Not starting</option>
<option>Cannot move</option>
<option>Damaged</option>
</select>

<h3 data-t="problemInfo"></h3>

<label data-t="problemType"></label>
<select name="problem_type">
<option>Engine not starting</option>
<option>Battery dead</option>
<option>Tire problem</option>
<option>Oil leaking</option>
<option>Brake problem</option>
<option>Port delivery</option>
<option>Other</option>
</select>

<label data-t="detail"></label>
<textarea name="problem_detail" rows="5"></textarea>

<h3 data-t="locationInfo"></h3>

<label data-t="currentAddress"></label>
<textarea name="current_address" rows="3"></textarea>

<label>Google Map Link</label>
<input type="text" name="map_link">

<label data-t="destination"></label>
<input type="text" name="destination_port" placeholder="Naha Port, Nakagusuku Port...">

<div class="notice">
<h3>💳 Payment Policy</h3>
<p data-t="payment1"></p>
<p>Payment is accepted by card only.</p>
</div>

<button type="submit" data-t="submitBtn"></button>
</form>
</section>

<section class="section dark">
<h2 data-t="contactTitle"></h2>
<div class="contact">
<div class="phone">📞 070-8445-5348</div>
<p>〒901-2416<br>沖縄県中頭郡中城村和宇慶620−1</p>
<p data-t="hoursFull"></p>
</div>
</section>

<div class="fixed">
<a href="tel:07084455348">📞 Call</a>
</div>

<footer>© 2026 Sakura Recovery & Repair Service</footer>

<div class="ai-btn" onclick="toggleAI()">💬 AI</div>

<div class="ai-box" id="aiBox">
<div class="ai-head">Sakura Recovery AI</div>
<div class="ai-body" id="aiBody"></div>
<div class="ai-input-wrap">
<input class="ai-input" id="aiInput" placeholder="Message...">
<div class="ai-send" onclick="sendAI()">Send</div>
</div>
</div>

let currentLang="ja";

function changeLang(lang){
currentLang=lang;
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-t]").forEach(el=>{
const key=el.getAttribute("data-t");
if(TEXT[lang][key]) el.innerHTML=TEXT[lang][key];
});
document.querySelector(".ai-btn").innerHTML="💬 AI";
}

changeLang("ja");

document.getElementById("requestForm").addEventListener("submit",async function(e){
e.preventDefault();
const form=e.target;
const data=Object.fromEntries(new FormData(form).entries());
data.created_at=new Date().toISOString();
data.language=currentLang;
try{
await fetch("https://n8n.sakurajapanbot.tech/webhook/sakura-recovery-estimate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});
alert("送信ありがとうございました。スタッフよりご連絡いたします。");
form.reset();
}catch(error){
alert("送信エラーです。電話でお問い合わせください。");
}
});

function toggleAI(){
const box=document.getElementById("aiBox");
const body=document.getElementById("aiBody");
box.style.display=box.style.display==="block"?"none":"block";
if(!body.dataset.started) startAI();
}

function aiMsg(text,type="bot"){
const body=document.getElementById("aiBody");
const div=document.createElement("div");
div.className="ai-msg "+(type==="user"?"ai-user":"ai-bot");
div.innerHTML=text;
body.appendChild(div);
body.scrollTop=body.scrollHeight;
}

function startAI(){
const body=document.getElementById("aiBody");
body.dataset.started="yes";
aiMsg(TEXT[currentLang].aiWelcome);
aiMsg(`
<div class="lang-row">
<div class="ai-quick" onclick="setAILang('ja')">日本語</div>
<div class="ai-quick" onclick="setAILang('en')">English</div>
<div class="ai-quick" onclick="setAILang('zh')">中文</div>
<div class="ai-quick" onclick="setAILang('es')">Español</div>
<div class="ai-quick" onclick="setAILang('ru')">Русский</div>
<div class="ai-quick" onclick="setAILang('vi')">Tiếng Việt</div>
<div class="ai-quick" onclick="setAILang('ko')">한국어</div>
<div class="ai-quick" onclick="setAILang('ar')">العربية</div>
<div class="ai-quick" onclick="setAILang('ur')">Roman Urdu</div>
</div>
`);
showAIOptions();
}

function setAILang(lang){
currentLang=lang;
document.getElementById("siteLang").value=lang;
changeLang(lang);
aiMsg(document.getElementById("siteLang").selectedOptions[0].text,"user");
aiMsg(TEXT[currentLang].aiWelcome);
showAIOptions();
}

function showAIOptions(){
const L=TEXT[currentLang];
aiMsg(L.aiSelect);
aiMsg(`
<div class="ai-quick" onclick="quickAI('notmove')">🚗 ${currentLang==="ja"?"車が動かない":"Vehicle not moving"}</div>
<div class="ai-quick" onclick="quickAI('accident')">🚨 ${currentLang==="ja"?"事故・レッカー":"Accident / Tow"}</div>
<div class="ai-quick" onclick="quickAI('repair')">🔧 ${currentLang==="ja"?"修理相談":"Repair"}</div>
<div class="ai-quick" onclick="quickAI('port')">🚢 ${currentLang==="ja"?"港まで搬送":"Port Delivery"}</div>
<div class="ai-quick" onclick="quickAI('price')">💴 ${currentLang==="ja"?"料金":"Price"}</div>
`);
}

function quickAI(key){
aiMsg(key,"user");
const L=TEXT[currentLang];
aiMsg(L[key]||L.other);
aiMsg(`<div class="ai-quick" onclick="document.getElementById('requestForm').scrollIntoView({behavior:'smooth'})">${L.formGo}</div>`);
}

function replyAI(text){
const s=text.toLowerCase();
let key="other";
if(s.includes("start")||s.includes("battery")||s.includes("動かない")||s.includes("gaari"))key="notmove";
else if(s.includes("accident")||s.includes("tow")||s.includes("事故")||s.includes("レッカー"))key="accident";
else if(s.includes("repair")||s.includes("修理"))key="repair";
else if(s.includes("port")||s.includes("港"))key="port";
else if(s.includes("price")||s.includes("cost")||s.includes("料金")||s.includes("いくら"))key="price";
quickAI(key);
}

function sendAI(){
const input=document.getElementById("aiInput");
const text=input.value.trim();
if(!text)return;
aiMsg(text,"user");
input.value="";
setTimeout(()=>replyAI(text),350);
}

document.addEventListener("keydown",function(e){
if(e.key==="Enter" && document.activeElement.id==="aiInput")sendAI();
});
</script>
